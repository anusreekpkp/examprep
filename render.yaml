# Render Blueprint - https://render.com/docs/blueprint-spec
# Create both services at once: Render Dashboard -> New -> Blueprint -> pick this repo.

services:
  # ---------------------------------------------------------------- API ----
  - type: web
    name: examprep-api
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    # --include=dev is required: NODE_ENV=production below makes npm omit
    # devDependencies, which would strip typescript, prisma and tsx.
    buildCommand: npm ci --include=dev && npm run build:server
    # migrate deploy runs the committed migrations; it never prompts and never drops data.
    startCommand: npm run db:deploy --workspace=server && npm run start --workspace=server
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Set in the Render dashboard - paste the Neon pooled connection string.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 30d
      # Filled in after the static site gets its URL.
      - key: CORS_ORIGIN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

      # Sign in with Google. Paste an OAuth 2.0 Web application client ID from
      # console.cloud.google.com; the button stays hidden until this is set.
      - key: GOOGLE_CLIENT_ID
        sync: false

      # Password reset email. Without a key the reset link is written to this
      # service's log instead, so the flow still works.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: ExamPrep <onboarding@resend.dev>

      # Base URL used in emailed links; defaults to CORS_ORIGIN when blank.
      - key: APP_URL
        sync: false

  # ------------------------------------------------------------- CLIENT ----
  # Static sites have no plan field - Render always serves them free.
  - type: web
    name: examprep-web
    runtime: static
    rootDir: .
    # Same reason as the API: vite and typescript are devDependencies.
    buildCommand: npm ci --include=dev && npm run build:client
    staticPublishPath: client/dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Careful: despite the name, `property: host` returns only the SERVICE
      # NAME ("examprep-api-t3p8"), not a hostname. client/src/lib/api.ts
      # appends .onrender.com to a dotless value to compensate. If you move the
      # API to a custom domain, replace this with an explicit full URL.
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: examprep-api
          property: host
    routes:
      # Client-side routing: every unknown path must return index.html, not a 404.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
